
name: Angel Engine - Build Stride GameStudio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Git LFS
        shell: pwsh
        run: git lfs install

      - name: Download official Stride source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/stride3d/stride.git stride-source
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Stride source."
          }

          git -C stride-source lfs pull
          if ($LASTEXITCODE -ne 0) {
            throw "Git LFS download failed."
          }

      - name: Build Stride GameStudio editor
        shell: pwsh
        run: |
          $project = "stride-source/sources/editor/Stride.GameStudio/Stride.GameStudio.csproj"

          if (-not (Test-Path $project)) {
            throw "Stride.GameStudio.csproj was not found."
          }

          dotnet --info
          dotnet build $project -c Release --verbosity minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Stride.GameStudio build failed."
          }

      - name: Package editor output
        shell: pwsh
        run: |
          $exe = Get-ChildItem "stride-source" -Recurse -Filter "Stride.GameStudio.exe" -File |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1

          if ($null -eq $exe) {
            Get-ChildItem "stride-source/sources/editor/Stride.GameStudio" -Recurse -Filter "Stride.GameStudio.*" -File |
              Select-Object -First 40 -ExpandProperty FullName
            throw "Editor executable was not found."
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "Angel-Engine-Windows"
          $zip = Join-Path $env:GITHUB_WORKSPACE "Angel-Engine-Windows.zip"

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") $stage -Recurse -Force

          Copy-Item "stride-source/LICENSE.md" $stage -Force
          if (Test-Path "stride-source/THIRD PARTY.md") {
            Copy-Item "stride-source/THIRD PARTY.md" $stage -Force
          }

          @"
          Angel Engine - Windows test build

          This build uses the open-source Stride Game Engine as its base.
          See LICENSE.md and THIRD PARTY.md for licensing information.
          Branding and customization may not yet be complete.
          "@ | Set-Content (Join-Path $stage "LEIA-ME.txt") -Encoding UTF8

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          Get-Item $zip | Select-Object FullName, Length

      - name: Upload Angel Engine ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Engine-Windows
          path: Angel-Engine-Windows.zip
          if-no-files-found: error
          retention-days: 7
